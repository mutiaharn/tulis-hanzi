<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>periksa tata letak</title>
<style>body{font:12.5px monospace;margin:0}pre{padding:10px;white-space:pre-wrap}</style></head>
<body>
<iframe id="app" src="../app/index.html" style="border:0;display:block;width:360px;height:740px"></iframe>
<pre id="out">mengukur…</pre>
<script>
const out = document.getElementById('out');
const sleep = ms => new Promise(r => setTimeout(r, ms));
(async function () {
  const win = document.getElementById('app').contentWindow;
  let t = 0;
  while (!(win.tulisHanzi && win.tulisHanzi.hsk1) && t++ < 120) await sleep(150);
  const doc = win.document, st = win.tulisHanzi;
  const L = [];
  const px = r => ({ x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) });

  function periksa(judul) {
    const de = doc.documentElement;
    const vw = de.clientWidth;
    const chips = [...doc.querySelectorAll('#lesson-list .chip')];
    const keluar = chips.filter(c => { const r = c.getBoundingClientRect(); return r.right > vw + 0.5 || r.left < -0.5; });
    const par = doc.querySelector('.lead');
    const pr = par ? par.getBoundingClientRect() : null;
    // apakah ada elemen lain yang menumpuk di atas paragraf pengantar?
    const tumpuk = par ? doc.elementsFromPoint(Math.round(pr.left + pr.width / 2), Math.round(pr.top + pr.height / 2))
      .filter(e => e !== par && e.tagName !== 'HTML' && e.tagName !== 'BODY').map(e => e.tagName + '.' + e.className) : [];
    L.push({
      layar: judul,
      lebarTampil: vw,
      overflowHorizontal: de.scrollWidth > vw,
      scrollWidth: de.scrollWidth,
      chip: chips.length,
      chipKeluarLayar: keluar.length,
      barisChip: new Set(chips.map(c => Math.round(c.getBoundingClientRect().top))).size,
      pengantar: pr ? px(pr) : null,
      elemenMenumpukPengantar: tumpuk
    });
  }

  periksa('daftar (360px)');

  // layar latihan untuk kata 3 aksara terpanjang
  const tiga = [...doc.querySelectorAll('#lesson-list .chip')].find(c => c.querySelector('.hzc').textContent === '火车站');
  tiga.click();
  await sleep(600);
  const cell = doc.querySelector('#cell').getBoundingClientRect();
  const svg = doc.querySelector('#hw svg');
  const btn = [...doc.querySelectorAll('#screen-practice .btn')].map(b => {
    const r = b.getBoundingClientRect();
    return { t: b.textContent.trim(), ok: b.scrollWidth <= Math.ceil(r.width) + 1, w: Math.round(r.width) };
  });
  const steps = [...doc.querySelectorAll('#p-steps .ch')].map(s => s.textContent);
  L.push({
    layar: 'latihan 火车站',
    kanvas: px(cell),
    kanvasInternal: Number(svg.getAttribute('width')),
    samaUkuran: Math.abs(cell.width - Number(svg.getAttribute('width'))) < 1.5,
    penandaGoresan: doc.querySelectorAll('#p-dots i').length,
    aksaraKata: steps,
    pinyin: doc.querySelector('#p-pinyin').textContent,
    arti: doc.querySelector('#p-arti').textContent,
    tombolTidakTerpotong: btn.every(b => b.ok),
    tombol: btn,
    overflowHorizontal: doc.documentElement.scrollWidth > doc.documentElement.clientWidth
  });
  out.textContent = JSON.stringify(L, null, 1);
  document.title = 'SELESAI';
})();
</script>
</body></html>
